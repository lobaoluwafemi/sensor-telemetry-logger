; Two environments share the hardware-independent code in lib/:
;   uno    - bare-metal C firmware for the ATmega328P (no Arduino framework)
;   native - the same lib/ code compiled for the host, so the logic is unit-tested
;            on every push without needing a board

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
monitor_speed = 115200
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Werror
; printf support for %lu is in the default avr-libc vfprintf; float is not used.

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror

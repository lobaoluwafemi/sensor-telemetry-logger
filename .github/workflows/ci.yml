name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run unit tests on the host
        run: pio test -e native

      - name: Build firmware for the Uno
        run: pio run -e uno

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uno
          path: .pio/build/uno/firmware.hex

  host:
    name: Host logger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r host/requirements.txt

      - name: Run tests
        run: pytest host/tests -v
